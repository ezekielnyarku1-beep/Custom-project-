<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" />
  </head>
  <body>
    <main id="root" aria-busy="true">
      <div class="skeleton-screen" role="status" aria-label="Loading workspace">
        <div class="skeleton-sidebar">
          <div class="skeleton skeleton-logo"></div>
          <div class="skeleton skeleton-block"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row short"></div>
          <div class="skeleton skeleton-row"></div>
        </div>
        <div class="skeleton-page">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton-stats">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
          <div class="skeleton skeleton-banner"></div>
          <div class="skeleton-grid">
            <div class="skeleton skeleton-card large"></div>
            <div class="skeleton skeleton-card large"></div>
            <div class="skeleton skeleton-card large"></div>
          </div>
        </div>
      </div>
    </main>
    <template id="auth">
      <aside class="brand">
        <div class="auth-brand"><span class="brand-monogram" aria-hidden="true">O</span><div><strong class="wordmark"></strong><small>Project management</small></div></div>
        <div class="brand-message">
          <p class="tagline">Innovation &amp; excellence</p>
          <p class="headline">Forward-Thinking Solutions For Tomorrow’s Challenges.</p>
          <p class="brand-company">Inpact</p>
        </div>
        <small class="brand-footer">Overview · Project management</small>
      </aside>
      <section class="form-panel">
        <div class="form-content">
          <p class="auth-eyebrow"></p>
          <h1></h1>
          <p class="subtitle"></p>
          <form novalidate>
            <button type="submit"></button>
          </form>
          <p class="form-footer"></p>
          <p class="auth-note">Your projects. Your team. One workspace.</p>
        </div>
      </section>
    </template>
    <template id="field">
      <div class="field">
        <label></label>
        <div class="input-wrap"><input required /></div>
        <small role="alert" hidden></small>
      </div>
    </template>
    <template id="dashboard">
      <aside class="sidebar">
        <div class="sidebar-header">
          <strong class="wordmark"></strong>
          <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-menu">
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
          </button>
        </div>
        <div class="sidebar-menu" id="sidebar-menu">
          <div class="workspace"><strong id="space-name"></strong><small id="space-role"></small></div>
          <div><nav aria-label="Workspace"></nav></div>
          <button class="text-button" data-action="logout">Log out</button>
        </div>
      </aside>
      <div class="dashboard-main">
        <header class="topbar">
          <p class="breadcrumb">Workspace <span>/</span> <strong id="current-view"></strong></p>
          <form id="search-form" role="search"><label class="search"><input name="q" type="search" placeholder="Search projects, tasks…" aria-label="Search projects and tasks, press Enter" /></label></form>
          <div class="top-links"><a href="#/notifications">Notifications</a> · <a href="#/settings">Account</a></div>
        </header>
        <div class="dashboard-content" id="content" tabindex="-1"></div>
      </div>
      <dialog aria-labelledby="dialog-title">
        <div class="section-heading"><h2 id="dialog-title"></h2><button class="text-button" id="close-dialog" aria-label="Close dialog">Close</button></div>
        <div id="dialog-content"></div>
      </dialog>
    </template>
    <script defer src="./src/validate.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
